# Workflow 2: GitHub −0.1 content → GitLab content-sync → Cloudflare ace.
# Do not put Cloudflare API tokens in this public repo.
#
# Secrets (yozshd/access):
#   GITLAB_PIPELINE_TRIGGER_TOKEN  GitLab Settings → CI/CD → Pipeline trigger tokens
#   GITLAB_PROJECT_ID              numeric id of gitlab.com/yozsh/yozsh
#   STRIPE_WEBHOOK_SECRET          Signing secret for etc.yoz.sh/api/stripe/webhook.
#   STRIPE_SECRET_KEY              Restricted key (rk_) for Checkout and catalog.
#   STRIPE_THUMBS_UP_PRICE_ID      price_ or prod_ for the Thumbs up plan.
#   STRIPE_HIGH_FIVE_PRICE_ID      price_ or prod_ for the High five plan.
#   STRIPE_THUNDER_DAP_PRICE_ID    price_ or prod_ for the Thunder dap plan.
#     Those five are forwarded only on a manual run. GitLab writes each set
#     value onto etc-yozsh with CLOUDFLARE_API_TOKEN.
#     Do not put that Cloudflare token in this repo.
#
# Blacksmith: later swap `runs-on` to a Blacksmith label
# (e.g. blacksmith-4vcpu-ubuntu-2404). Keep ubuntu-latest until then.

name: Trigger GitLab content deploy

on:
  push:
    branches: [main]
    paths:
      - "src/content/**"
  workflow_dispatch:

concurrency:
  group: gitlab-content-deploy
  cancel-in-progress: false

jobs:
  trigger-gitlab:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger GitLab pipeline
        env:
          GITLAB_PIPELINE_TRIGGER_TOKEN: ${{ secrets.GITLAB_PIPELINE_TRIGGER_TOKEN }}
          GITLAB_PROJECT_ID: ${{ secrets.GITLAB_PROJECT_ID }}
          GITHUB_SHA: ${{ github.sha }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_THUMBS_UP_PRICE_ID: ${{ secrets.STRIPE_THUMBS_UP_PRICE_ID }}
          STRIPE_HIGH_FIVE_PRICE_ID: ${{ secrets.STRIPE_HIGH_FIVE_PRICE_ID }}
          STRIPE_THUNDER_DAP_PRICE_ID: ${{ secrets.STRIPE_THUNDER_DAP_PRICE_ID }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test -n "$GITLAB_PIPELINE_TRIGGER_TOKEN"
          test -n "$GITLAB_PROJECT_ID"
          # Multipart form fields. A content push must not include the Stripe values.
          args=(
            --fail --silent --show-error --request POST
            --form "token=${GITLAB_PIPELINE_TRIGGER_TOKEN}"
            --form "ref=main"
            --form "variables[TRIGGER_SOURCE]=github-access-content"
            --form "variables[GITHUB_SHA]=${GITHUB_SHA}"
          )
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            [ -z "${STRIPE_WEBHOOK_SECRET:-}" ] || args+=(--form-string "variables[STRIPE_WEBHOOK_SECRET]=${STRIPE_WEBHOOK_SECRET}")
            [ -z "${STRIPE_SECRET_KEY:-}" ] || args+=(--form-string "variables[STRIPE_SECRET_KEY]=${STRIPE_SECRET_KEY}")
            [ -z "${STRIPE_THUMBS_UP_PRICE_ID:-}" ] || args+=(--form-string "variables[STRIPE_THUMBS_UP_PRICE_ID]=${STRIPE_THUMBS_UP_PRICE_ID}")
            [ -z "${STRIPE_HIGH_FIVE_PRICE_ID:-}" ] || args+=(--form-string "variables[STRIPE_HIGH_FIVE_PRICE_ID]=${STRIPE_HIGH_FIVE_PRICE_ID}")
            [ -z "${STRIPE_THUNDER_DAP_PRICE_ID:-}" ] || args+=(--form-string "variables[STRIPE_THUNDER_DAP_PRICE_ID]=${STRIPE_THUNDER_DAP_PRICE_ID}")
          fi
          curl "${args[@]}" \
            "https://gitlab.com/api/v4/projects/${GITLAB_PROJECT_ID}/trigger/pipeline"
